<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:ital,wght@0,500;0,600;0,700;1,400&display=swap');
    * { box-sizing: border-box; }
    .phone {
      --bg: oklch(97% 0.014 75);
      --surface: oklch(99% 0.005 80);
      --surface-2: oklch(94% 0.02 70);
      --border: oklch(88% 0.02 65);
      --text: oklch(24% 0.035 45);
      --text-muted: oklch(48% 0.028 50);
      --text-faint: oklch(66% 0.02 55);
      --accent: oklch(45% 0.1 45);
      width: 390px; height: 844px; position: relative; overflow: hidden;
      background: oklch(20% 0.02 50 / 0.55);
      color: var(--text);
      font-family: 'Work Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .phone .display { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
    .row { display: flex; align-items: center; }
    .dim-bg { position: absolute; inset: 0; background: var(--bg); filter: blur(1px); opacity: .5; }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 26px 26px 0 0; padding: 14px 22px 34px; box-shadow: 0 -12px 40px rgba(0,0,0,.25); }
    .grabber { width: 36px; height: 4px; border-radius: 999px; background: var(--surface-2); margin: 0 auto 18px; }
    .closebtn { position: absolute; top: 14px; right: 18px; width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
    .seg { display: flex; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 22px; }
    .seg > div { flex: 1; text-align: center; padding: 11px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .seg > div.active { background: var(--accent); color: oklch(98% 0.01 60); }
    .amount { text-align: center; padding: 10px 0 22px; }
    .amount .num { font-family: 'Instrument Serif', Georgia, serif; font-size: 52px; }
    .field { border: 1px solid var(--border); border-radius: 14px; padding: 13px 16px; font-size: 14px; margin-bottom: 12px; }
    .field .label { font-size: 11px; color: var(--text-faint); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 3px; }
    .pickbtn { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .pickbtn .label { font-size: 11px; color: var(--text-faint); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
    .pickbtn .value { font-size: 14px; font-weight: 600; margin-top: 2px; }
    .btn-primary { background: var(--accent); color: oklch(98% 0.01 60); text-align: center; border-radius: 14px; padding: 16px; font-size: 15px; font-weight: 600; margin-top: 6px; }
  </style>
</helmet>
<div class="phone">
  <div class="dim-bg"></div>
  <div class="sheet">
    <div class="grabber"></div>
    <div class="closebtn">
      <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
    </div>
    <h2 class="display" style="font-size: 22px; margin: 0 0 16px;">Registro rápido</h2>

    <div class="seg">
      <div class="active">Gasto en efectivo</div>
      <div>Ingreso adicional</div>
    </div>

    <div class="amount">
      <div class="num">$450<span style="font-size: 22px; color: var(--text-faint);">.00</span></div>
      <div style="font-size: 12px; color: var(--text-faint); margin-top: 4px;">MXN</div>
    </div>

    <div class="row" style="gap: 10px; margin-bottom: 12px;">
      <div class="pickbtn" style="flex: 1;">
        <div class="row" style="gap: 8px;">
          <span style="width: 8px; height: 8px; border-radius: 2px; background: oklch(55% 0.13 40); flex-shrink: 0;"></span>
          <div>
            <div class="label">Categoría</div>
            <div class="value">Take-out</div>
          </div>
        </div>
        <svg width="15" height="15" viewBox="0 0 24 24" stroke="var(--text-faint)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </div>
      <div class="pickbtn" style="flex: 1;">
        <div>
          <div class="label">Descriptor</div>
          <div class="value">Tacos con Ana</div>
        </div>
        <svg width="15" height="15" viewBox="0 0 24 24" stroke="var(--text-faint)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </div>
    </div>

    <div class="field"><div class="label">Fecha</div>Hoy, 4 sept</div>

    <div class="btn-primary">Guardar</div>
  </div>
</div>
</x-dc>
</body>
</html>
