<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
    * { box-sizing: border-box; }
    .phone {
      --bg: oklch(97% 0.014 75);
      --surface: oklch(99% 0.005 80);
      --surface-2: oklch(94% 0.02 70);
      --border: oklch(88% 0.02 65);
      --text: oklch(24% 0.035 45);
      --text-muted: oklch(48% 0.028 50);
      --text-faint: oklch(66% 0.02 55);
      --accent: oklch(45% 0.1 45);
      --accent-soft: oklch(93% 0.035 50);
      width: 390px; height: 844px; position: relative; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'Work Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .phone .display { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
    .header { position: absolute; top: 0; left: 0; right: 0; padding: 56px 20px 0; }
    .center { position: absolute; top: 0; left: 0; right: 0; bottom: 88px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 40px; text-align: center; }
    .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); padding: 6px 12px; border-radius: 999px; margin-bottom: 22px; }
    .glyph { width: 96px; height: 96px; border-radius: 28px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
    .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 88px; background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-around; padding-top: 12px; }
    .tabitem { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 9.5px; font-weight: 500; color: var(--text-faint); white-space: nowrap; }
    .tabitem.active { color: var(--accent); }
    .fab { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: var(--surface); display: flex; align-items: center; justify-content: center; margin-top: -24px; box-shadow: 0 8px 18px oklch(45% 0.1 45 / 0.35); flex-shrink: 0; }
  </style>
</helmet>
<div class="phone">
  <div class="header">
    <h1 class="display" style="font-size: 26px; margin: 0;">Mi Patrimonio</h1>
  </div>

  <div class="center">
    <div class="badge">
      <svg width="12" height="12" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline></svg>
      Próximamente
    </div>
    <div class="glyph">
      <svg width="46" height="46" viewBox="0 0 24 24" stroke="var(--accent)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V11"></path><path d="M12 11c-4.5 0-7-3.2-7-7 4.5 0 7 2.2 7 7z"></path><path d="M12 11c4.5 0 7-3.2 7-7-4.5 0-7 2.2-7 7z"></path><path d="M6 21h12"></path></svg>
    </div>
    <div style="font-size: 18px; font-weight: 600;">Aquí va a crecer tu Patrimonio</div>
    <div style="font-size: 13.5px; color: var(--text-muted); margin-top: 10px; line-height: 1.5;">Estamos diseñando una forma visual de ver los resultados de tus buenos hábitos a largo plazo. Por ahora seguimos enfocados en que tu tracking financiero sea impecable.</div>
  </div>

  <div class="tabbar">
    <div class="tabitem">
      <svg width="21" height="21" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"></path><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"></path></svg>
      Inicio
    </div>
    <div class="tabitem">
      <svg width="21" height="21" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="14" y2="17"></line></svg>
      Movimientos
    </div>
    <div class="fab">
      <svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </div>
    <div class="tabitem">
      <svg width="21" height="21" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3.5"></circle></svg>
      Estrategias
    </div>
    <div class="tabitem active">
      <svg width="21" height="21" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10"></path><path d="M12 10c-4 0-6-3-6-6 4 0 6 2 6 6z"></path><path d="M12 10c4 0 6-3 6-6-4 0-6 2-6 6z"></path></svg>
      Patrimonio
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
