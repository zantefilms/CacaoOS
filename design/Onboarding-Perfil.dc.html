<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
    * { box-sizing: border-box; }
    .phone {
      --bg: oklch(97% 0.014 75);
      --surface: oklch(99% 0.005 80);
      --surface-2: oklch(94% 0.02 70);
      --border: oklch(88% 0.02 65);
      --text: oklch(24% 0.035 45);
      --text-muted: oklch(48% 0.028 50);
      --text-faint: oklch(66% 0.02 55);
      --accent: oklch(45% 0.1 45);
      --accent-soft: oklch(93% 0.035 50);
      width: 390px; height: 844px; position: relative; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'Work Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .phone h1 { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
    .col { position: absolute; inset: 0; padding: 60px 22px 30px; display: flex; flex-direction: column; }
    .row { display: flex; align-items: center; }
    .progress-dots { display: flex; gap: 6px; margin-bottom: 22px; }
    .dot { flex: 1; height: 4px; border-radius: 999px; background: var(--surface-2); }
    .dot.done { background: var(--accent); }
    .field-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .03em; }
    .amount-field { border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 18px; font-size: 26px; font-weight: 600; }
    .bank-chip { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
    .bank-badge { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: white; flex-shrink: 0; }
    .seg { display: flex; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .seg > div { flex: 1; text-align: center; padding: 12px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .seg > div.active { background: var(--accent); color: oklch(98% 0.01 60); }
    .btn-primary { background: var(--accent); color: oklch(98% 0.01 60); text-align: center; border-radius: 14px; padding: 15px; font-size: 15px; font-weight: 600; }
    .add-row { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--accent); padding: 4px 0 14px; }
  </style>
</helmet>
<div class="phone">
  <div class="col">
    <div class="progress-dots">
      <div class="dot done"></div><div class="dot done"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <h1 style="font-size: 26px; margin: 0;">Cuéntanos de tus finanzas</h1>
    <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Esto nos ayuda a armar tu presupuesto y tus metas.</div>

    <div class="field-label">Ingreso mensual aproximado</div>
    <div class="amount-field">$ 32,000<span style="font-size:14px; color:var(--text-faint); font-weight:500;"> MXN</span></div>

    <div class="field-label">Cuentas a rastrear</div>
    <div class="bank-chip">
      <div class="bank-badge" style="background: oklch(45% 0.13 25);">S</div>
      <div style="flex:1;">
        <div style="font-size: 14px; font-weight: 600;">Santander</div>
        <div style="font-size: 12px; color: var(--text-faint);">Débito · terminación 4021</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-faint);"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </div>
    <div class="bank-chip">
      <div class="bank-badge" style="background: oklch(30% 0.02 40);">Nu</div>
      <div style="flex:1;">
        <div style="font-size: 14px; font-weight: 600;">Nu</div>
        <div style="font-size: 12px; color: var(--text-faint);">Crédito · terminación 8890</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-faint);"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </div>
    <div class="add-row">
      <svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Agregar cuenta
    </div>

    <div class="field-label" style="margin-top: 4px;">Día de corte del periodo</div>
    <div class="seg">
      <div class="active">Inicio de mes</div>
      <div>Quincena</div>
    </div>

    <div style="flex: 1;"></div>
    <div class="btn-primary">Continuar</div>
  </div>
</div>
</x-dc>
</body>
</html>
