<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Work+Sans:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: oklch(45% 0.1 45); } a:hover { color: oklch(37% 0.09 45); }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: oklch(97% 0.014 75); color: oklch(24% 0.035 45); font-family: 'Work Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased;">

  <div style="display: flex; flex-direction: column; gap: 28px; padding: 40px 26px 0;">

    <div style="display: flex; flex-direction: column; gap: 3px;">
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 34px; line-height: 1.05; letter-spacing: -0.01em;">Estrategias</span>
      <span style="font-size: 12.5px; color: oklch(66% 0.02 55);">1 – 30 de septiembre</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 22px;">
      <span style="font-size: 10.5px; font-weight: 500; letter-spacing: 0.09em; text-transform: uppercase; color: oklch(66% 0.02 55);">Metas</span>

      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <span style="font-size: 15px; letter-spacing: -0.005em;">Ahorro del periodo</span>
          <span style="font-size: 12px; color: oklch(66% 0.02 55); font-variant-numeric: tabular-nums;">74%</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 7px;">
          <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 27px; line-height: 1;">$5,880</span>
          <span style="font-size: 12px; color: oklch(66% 0.02 55);">de $8,000</span>
        </div>
        <div style="height: 2px; background: oklch(88% 0.02 65); border-radius: 2px;">
          <div style="width: 74%; height: 2px; background: oklch(45% 0.1 45); border-radius: 2px;"></div>
        </div>
      </div>

      <div style="height: 1px; background: oklch(88% 0.02 65);"></div>

      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <span style="font-size: 15px; letter-spacing: -0.005em;">Fondo de emergencia</span>
          <span style="font-size: 12px; color: oklch(66% 0.02 55); font-variant-numeric: tabular-nums;">41%</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 7px;">
          <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 27px; line-height: 1;">$18,400</span>
          <span style="font-size: 12px; color: oklch(66% 0.02 55);">de $45,000</span>
        </div>
        <div style="height: 2px; background: oklch(88% 0.02 65); border-radius: 2px;">
          <div style="width: 41%; height: 2px; background: oklch(45% 0.1 45); border-radius: 2px;"></div>
        </div>
      </div>

      <div style="height: 1px; background: oklch(88% 0.02 65);"></div>

      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <span style="font-size: 15px; letter-spacing: -0.005em;">Ahorro anual</span>
          <span style="font-size: 12px; color: oklch(66% 0.02 55); font-variant-numeric: tabular-nums;">54%</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 7px;">
          <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 27px; line-height: 1;">$52,300</span>
          <span style="font-size: 12px; color: oklch(66% 0.02 55);">de $96,000</span>
        </div>
        <div style="height: 2px; background: oklch(88% 0.02 65); border-radius: 2px;">
          <div style="width: 54%; height: 2px; background: oklch(45% 0.1 45); border-radius: 2px;"></div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; height: 44px; color: oklch(45% 0.1 45);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
        <span style="font-size: 14px; font-weight: 500;">Nueva meta</span>
      </div>
    </div>

    <div style="height: 1px; background: oklch(88% 0.02 65);"></div>

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <span style="font-size: 10.5px; font-weight: 500; letter-spacing: 0.09em; text-transform: uppercase; color: oklch(66% 0.02 55);">Gastos por tipo</span>

      <div style="display: flex; height: 6px; border-radius: 3px; overflow: hidden;">
        <div style="width: 42%; background: oklch(45% 0.1 45);"></div>
        <div style="width: 25%; background: oklch(65% 0.08 45);"></div>
        <div style="width: 33%; background: oklch(88% 0.02 65);"></div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 11px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="width: 7px; height: 7px; border-radius: 2px; background: oklch(45% 0.1 45);"></span>
          <span style="flex: 1; font-size: 13.5px;">Fijo</span>
          <span style="font-size: 13.5px; color: oklch(48% 0.028 50); font-variant-numeric: tabular-nums;">$7,820 · 42%</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="width: 7px; height: 7px; border-radius: 2px; background: oklch(65% 0.08 45);"></span>
          <span style="flex: 1; font-size: 13.5px;">Semi-fijo</span>
          <span style="font-size: 13.5px; color: oklch(48% 0.028 50); font-variant-numeric: tabular-nums;">$4,600 · 25%</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="width: 7px; height: 7px; border-radius: 2px; background: oklch(88% 0.02 65);"></span>
          <span style="flex: 1; font-size: 13.5px;">Variable</span>
          <span style="font-size: 13.5px; color: oklch(48% 0.028 50); font-variant-numeric: tabular-nums;">$6,000 · 33%</span>
        </div>
      </div>
    </div>

  </div>

  <div style="position: absolute; inset-inline: 0; bottom: 0; display: flex; align-items: center; justify-content: space-around; height: 78px; padding-bottom: 6px; border-top: 1px solid oklch(88% 0.02 65); background: oklch(99% 0.005 80);">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 62px; color: oklch(66% 0.02 55);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="6.5" height="6.5" rx="1.6"></rect>
        <rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"></rect>
        <rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"></rect>
        <rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"></rect>
      </svg>
      <span style="font-size: 9.5px;">Inicio</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 62px; color: oklch(66% 0.02 55);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h16M4 12h16M4 17h10"></path>
      </svg>
      <span style="font-size: 9.5px;">Movimientos</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 62px; color: oklch(66% 0.02 55);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"></circle>
        <path d="M12 8.5v7M8.5 12h7"></path>
      </svg>
      <span style="font-size: 9.5px;">Registrar</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 62px; color: oklch(45% 0.1 45);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 16l-1.447 .724a1 1 0 0 0 -.553 .894v2.382h12v-2.382a1 1 0 0 0 -.553 -.894l-1.447 -.724h-8"></path>
        <path d="M9 3l1 3l-3.491 2.148a1 1 0 0 0 .524 1.852h2.967l-2.073 6h7.961l.112 -5c0 -3 -1.09 -5.983 -4 -7c-1.94 -.678 -2.94 -1.011 -3 -1"></path>
      </svg>
      <span style="font-size: 9.5px; font-weight: 500;">Estrategias</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 62px; color: oklch(66% 0.02 55);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12l-2 0l9 -9l9 9l-2 0"></path>
        <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"></path>
        <path d="M10 12h4v4h-4l0 -4"></path>
      </svg>
      <span style="font-size: 9.5px;">Patrimonio</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
