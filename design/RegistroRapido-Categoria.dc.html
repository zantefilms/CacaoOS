<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
    * { box-sizing: border-box; }
    .phone {
      --bg: oklch(97% 0.014 75);
      --surface: oklch(99% 0.005 80);
      --surface-2: oklch(94% 0.02 70);
      --border: oklch(88% 0.02 65);
      --text: oklch(24% 0.035 45);
      --text-muted: oklch(48% 0.028 50);
      --text-faint: oklch(66% 0.02 55);
      --accent: oklch(45% 0.1 45);
      width: 390px; height: 844px; position: relative; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'Work Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .phone .display { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
    .row { display: flex; align-items: center; }
    .top { position: absolute; top: 0; left: 0; right: 0; padding: 56px 20px 14px; display: flex; align-items: center; justify-content: space-between; }
    .closebtn { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
    .grid { position: absolute; top: 104px; left: 0; right: 0; bottom: 20px; padding: 0 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; align-content: start; }
    .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 10px 4px; text-align: center; }
    .cell.selected { border-color: var(--accent); background: oklch(93% 0.035 50); }
    .cell .ic { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .cell .lbl { font-size: 10.5px; font-weight: 600; line-height: 1.15; }
  </style>
</helmet>

    <div class="closebtn">

    </div>
  </div>
