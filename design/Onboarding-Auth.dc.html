<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
    * { box-sizing: border-box; }
    .phone {
      --bg: oklch(97% 0.014 75);
      --surface: oklch(99% 0.005 80);
      --surface-2: oklch(94% 0.02 70);
      --border: oklch(88% 0.02 65);
      --text: oklch(24% 0.035 45);
      --text-muted: oklch(48% 0.028 50);
      --text-faint: oklch(66% 0.02 55);
      --accent: oklch(45% 0.1 45);
      --accent-strong: oklch(37% 0.09 45);
      --accent-soft: oklch(93% 0.035 50);
      width: 390px; height: 844px; position: relative; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'Work Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .phone .display { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
    .phone a { color: var(--accent); text-decoration: none; }
    .col { position: absolute; inset: 0; padding: 76px 24px 40px; display: flex; flex-direction: column; }
    .field { border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 14px 16px; font-size: 15px; color: var(--text); margin-bottom: 12px; }
    .field .label { font-size: 11px; color: var(--text-faint); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px; }
    .btn-primary { background: var(--accent); color: oklch(98% 0.01 60); text-align: center; border-radius: 14px; padding: 15px; font-size: 15px; font-weight: 600; }
    .btn-apple { background: oklch(20% 0 0); color: white; text-align: center; border-radius: 14px; padding: 15px; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
  </style>
</helmet>
<div class="phone">
  <div class="col">
    <div style="text-align: center; margin-bottom: 44px;">
      <div style="width: 56px; height: 56px; border-radius: 18px; background: var(--accent); margin: 0 auto 16px; display:flex; align-items:center; justify-content:center;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="oklch(98% 0.01 60)"><path d="M12 3c-1 1.6-1 2.9-.2 4 1.8-1 3.6-.5 4.6.9 1.7 2.4 1.1 6.6-1.5 9.6-1.1 1.3-2.2 1.9-3 1.9-.9 0-1.5-.5-2.9-.5s-2 .5-2.9.5c-.9 0-2.2-1-3.4-2.8C.6 13.9.3 9.4 2.6 7c1.2-1.3 2.7-1.9 4.1-1.6.9.2 1.6.6 2.3.6.6 0 1.5-.6 2.6-.7.1 0 .3 0 .4.1-1 .4-1.7 1-2 2.2 1.3 0 2-1.1 2-2.6-.9.1-1.6.5-2 1z"></path></svg>
      </div>
      <div class="display" style="font-size: 30px;">Cacao</div>
      <div style="font-size: 14px; color: var(--text-muted); margin-top: 6px;">Entiende en qué se te va el dinero.</div>
    </div>

    <div class="btn-apple">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M12 3c-1 1.6-1 2.9-.2 4 1.8-1 3.6-.5 4.6.9 1.7 2.4 1.1 6.6-1.5 9.6-1.1 1.3-2.2 1.9-3 1.9-.9 0-1.5-.5-2.9-.5s-2 .5-2.9.5c-.9 0-2.2-1-3.4-2.8C.6 13.9.3 9.4 2.6 7c1.2-1.3 2.7-1.9 4.1-1.6.9.2 1.6.6 2.3.6.6 0 1.5-.6 2.6-.7.1 0 .3 0 .4.1-1 .4-1.7 1-2 2.2 1.3 0 2-1.1 2-2.6-.9.1-1.6.5-2 1z"></path></svg>
      Continuar con Apple
    </div>

    <div class="row" style="display:flex; align-items:center; gap:12px; margin: 22px 0;">
      <div style="flex:1; height:1px; background:var(--border);"></div>
      <span style="font-size: 12px; color: var(--text-faint);">o con tu correo</span>
      <div style="flex:1; height:1px; background:var(--border);"></div>
    </div>

    <div class="field"><div class="label">Correo</div>fer.gonzalez@gmail.com</div>
    <div class="field"><div class="label">Contraseña</div>••••••••••</div>

    <div class="btn-primary" style="margin-top: 8px;">Crear cuenta</div>

    <div style="flex: 1;"></div>

    <div style="text-align: center; font-size: 13px; color: var(--text-muted);">
      ¿Ya tienes cuenta? <a href="#">Inicia sesión</a>
    </div>
    <div style="text-align: center; font-size: 11px; color: var(--text-faint); margin-top: 14px; line-height: 1.5;">
      Al continuar aceptas los Términos y el Aviso de Privacidad de Cacao.
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
